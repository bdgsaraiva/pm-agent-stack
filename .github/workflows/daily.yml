name: daily-fetch-and-monitor

on:
  schedule:
    - cron: "40 8 * * 1-5"      # 08:40 UTC = 05:40 BRT, Mon-Fri (Brazil has no daylight saving)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Refetch full history (ignores stored data)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55          # 20 Oct: 55 (was 40, then 50); ~10 min of offline tests + fetch; BigQuery fills and discovery add more
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests (offline)
        id: tests
        continue-on-error: true      # a failing test is reported (last step) but never stops the data refresh
        run: python -m pytest -q

      - name: Restore discovery day files
        # narrative discovery's day aggregates (~1-2 MB a day, 90 days) live in the Actions cache, not in git;
        # if the cache is evicted the adapter backfills them over the next runs
        uses: actions/cache/restore@v4
        with:
          path: data/narratives/discovery/days
          key: discovery-days-${{ github.run_id }}
          restore-keys: discovery-days-

      - name: Fetch and monitor
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}            # GDELT via BigQuery (adapters/gdelt_bq.py); read from env, never written
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          USDA_FAS_API_KEY: ${{ secrets.USDA_FAS_API_KEY }}  # ready for agent 9 (balance keeper); unused until it is built
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}  # AI demand signals: token rankings (adapters/openrouter.py); skipped while unset
          TZ: America/Sao_Paulo
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python -m pmstack all --backfill
          else
            python -m pmstack all
          fi

      - name: Save discovery day files
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/narratives/discovery/days
          key: discovery-days-${{ github.run_id }}

      - name: Commit research memory
        run: |
          git config user.name  "pm-stack-bot"
          git config user.email "pm-stack-bot@users.noreply.github.com"
          git add data briefs logs
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: $(TZ=America/Sao_Paulo date +%F) fetch + fact pack"
            git pull --rebase
            git push
          fi

      - name: Report test failure
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Offline tests failed; data and fact pack were still refreshed. See the Tests step."
          exit 1
