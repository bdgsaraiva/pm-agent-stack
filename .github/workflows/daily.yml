name: daily-fetch-and-monitor

on:
  schedule:
    - cron: "40 8 * * 1-5"      # 08:40 UTC = 05:40 BRT, Mon-Fri (Brazil has no daylight saving)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Refetch full history (ignores stored data)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests (offline)
        run: python -m pytest -q

      - name: Fetch and monitor
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TZ: America/Sao_Paulo
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python -m pmstack all --backfill
          else
            python -m pmstack all
          fi

      - name: Commit research memory
        run: |
          git config user.name  "pm-stack-bot"
          git config user.email "pm-stack-bot@users.noreply.github.com"
          git add data briefs logs
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: $(TZ=America/Sao_Paulo date +%F) fetch + fact pack"
            git pull --rebase
            git push
          fi
