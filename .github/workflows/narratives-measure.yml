name: narratives-measure

# Manual only: measures candidate narrative definitions on GDELT's GKG in BigQuery (pmstack/narrative_measure.py)
# before any is frozen. Commits the result (docs/research/narrative-measure/) and the shared byte ledger.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Spec YAML (docs/research/narrative-measure/<date>-spec.yaml)"
        required: true
      max_gb:
        description: "Byte cap for this run, GB (the 800 GB monthly cap still holds)"
        default: "60"

permissions:
  contents: write

concurrency:
  group: daily                 # never alongside the daily job: both write the byte ledger
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Measure
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}            # read from env only, never written
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SPEC: ${{ inputs.spec }}
          MAX_GB: ${{ inputs.max_gb }}
        run: |
          out="${SPEC%-spec.yaml}-result.json"
          python -m pmstack narratives measure "$SPEC" --out "$out" --max-gb "$MAX_GB" || echo "::warning::measurement reported errors (see the result file)"
          cat "${out%.json}.md"

      - name: Commit result and byte ledger
        run: |
          git config user.name  "pm-stack-bot"
          git config user.email "pm-stack-bot@users.noreply.github.com"
          git add docs/research/narrative-measure data/obs/gdelt_bq/_bytes.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "research: narrative measurement $(date +%F)"
            git pull --rebase
            git push
          fi
