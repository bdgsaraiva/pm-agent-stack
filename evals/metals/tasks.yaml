# Metals specialist test set (v1, 25 Oct 2026; specialists-kickoff.md section 6). 20 dated questions with known
# answers from frozen public-data fixtures, graded by code (pmstack/cevals.py). Re-run before any change to the model,
# the /ask or specialist skill, the pack code or the knowledge layout. Gold answers: evals/metals/gold.yaml (the
# answering session must not open it). Every task reads only frozen fixtures, as of 2026-10-23.
# Sealed tasks are never used while tuning a prompt or skill: only at the gate.
version: 1
frozen: 2026-10-25
shared_rules: |
  You are the Metals specialist answering one task of Bernardo's metals test set (pm-agent-stack). Rules, as in the
  live /ask skill:
  - Use only the files the task names. Never open evals/metals/gold.yaml, other runs, tests/ or docs/.
  - Numbers come from the named files only, never from memory or the web. Copy figures as printed.
  - The as-of date is a hard wall: nothing after it exists.
  - No trade instructions, no price targets, no sizing. Label interpretation as inference.
  - If the files do not contain the answer, abstain: set "abstain": true and leave the answer fields null.
  - Write exactly one JSON object to the answer path given below, nothing else in that file.
fixtures:
  pack: evals/metals/fixtures/pack-2026-10-23-metals.json
  estimates: evals/metals/fixtures/estimates/
  drivers: evals/metals/fixtures/knowledge/

tasks:
  - id: mt-cu-spread
    asof: 2026-10-23
    files: [evals/metals/fixtures/pack-2026-10-23-metals.json]
    prompt: |
      LME copper cash minus 3-month: the raw spread and the spread net of interest (both in % of the 3-month price),
      and the percentile of the net spread. Is the market in backwardation or contango net of interest?
      Answer: {"raw_pct": <number>, "net_pct": <number>, "net_pctile": <number>, "state": "backwardation|contango", "abstain": false}
  - id: mt-cu-visible
    asof: 2026-10-23
    files: [evals/metals/fixtures/pack-2026-10-23-metals.json]
    prompt: |
      Visible copper stocks (LME + SHFE) in tonnes and their percentile since 2014.
      Answer: {"tonnes": <number>, "pctile": <number>, "abstain": false}
  - id: mt-cu-implied
    asof: 2026-10-23
    files: [evals/metals/fixtures/pack-2026-10-23-metals.json]
    prompt: |
      What copper spread net of interest do visible stocks imply from the storage fit, how far is the actual net spread
      above or below it (pp), and is the curve tighter or looser than stocks explain?
      Answer: {"implied_pct": <number>, "gap_pp": <number>, "reading": "tighter|looser", "abstain": false}
  - id: mt-shfe-cu
    asof: 2026-10-23
    files: [evals/metals/fixtures/pack-2026-10-23-metals.json]
    prompt: |
      SHFE copper stocks: % vs the 5-year same-week average, the latest weekly change (t), and that change vs its norm (sd).
      Answer: {"vs_5y_pct": <number>, "change_t": <number>, "z": <number>, "abstain": false}
  - id: mt-al-storage
    asof: 2026-10-23
    sealed: true
    files: [evals/metals/fixtures/pack-2026-10-23-metals.json]
    prompt: |
      Aluminium: visible-stocks percentile since 2014, the LME spread net of interest, the gap to the inventory-implied
      spread (pp), and the t-stat of the storage fit's slope.
      Answer: {"visible_pctile": <number>, "net_pct": <number>, "gap_pp": <number>, "t": <number>, "abstain": false}
  - id: mt-lme-cu-slope
    asof: 2026-10-23
    files: [evals/metals/fixtures/pack-2026-10-23-metals.json]
