# Ags specialist test set (v1, 30 Oct 2026; specialists-kickoff.md section 6). 20 dated questions with known answers
# from frozen public-data fixtures, graded by code (pmstack/cevals.py). Re-run before any change to the model, the /ask
# or specialist skill, the pack code or the knowledge layout. Gold answers: evals/ags/gold.yaml (the answering session
# must not open it). Every task reads only frozen fixtures, as of 2026-10-29. Sealed tasks: used only at the gate.
version: 1
frozen: 2026-10-30
shared_rules: |
  You are the Ags specialist answering one task of Bernardo's ags test set (pm-agent-stack). Rules, as in the live
  /ask skill:
  - Use only the files the task names. Never open evals/ags/gold.yaml, other runs, tests/ or docs/.
  - Numbers come from the named files only, never from memory or the web. Copy figures as printed.
  - The as-of date is a hard wall: nothing after it exists.
  - No trade instructions, no price targets, no sizing. Label interpretation as inference.
  - If the files do not contain the answer, abstain: set "abstain": true and leave the answer fields null.
  - Write exactly one JSON object to the answer path given below, nothing else in that file.
fixtures:
  pack: evals/ags/fixtures/pack-2026-10-29-ags.json
  estimates: evals/ags/fixtures/estimates/
  drivers: evals/ags/fixtures/knowledge/

tasks:
  - id: ag-corn-sur
    asof: 2026-10-29
    files: [evals/ags/fixtures/pack-2026-10-29-ags.json]
    prompt: |
      US corn 2026/27 stocks-to-use (WASDE), its percentile since 2007/08, and the WASDE report date.
      Answer: {"sur_pct": <number>, "pctile": <number>, "report_date": "YYYY-MM-DD", "abstain": false}
  - id: ag-corn-revision-vs-miss
    asof: 2026-10-29
    files: [evals/ags/fixtures/pack-2026-10-29-ags.json]
    prompt: |
      How large was the latest revision to US corn 2026/27 ending stocks, and was it larger or smaller than USDA's own
      average miss at this point of the season (both in million bushels)?
      Answer: {"revision": <number>, "avg_miss": <number>, "larger_than_miss": true|false, "abstain": false}
  - id: ag-soy-revision
    asof: 2026-10-29
    files: [evals/ags/fixtures/pack-2026-10-29-ags.json]
    prompt: |
      US soybeans 2026/27: ending-stocks revision vs the previous report (million bushels), USDA's average miss, and the
      stocks-to-use percentile.
      Answer: {"revision": <number>, "avg_miss": <number>, "pctile": <number>, "abstain": false}
  - id: ag-wheat-ex-china
    asof: 2026-10-29
    files: [evals/ags/fixtures/pack-2026-10-29-ags.json]
    prompt: |
      World ex China wheat 2026/27 stocks-to-use, and the US wheat stocks-to-use percentile.
      Answer: {"ex_china_sur_pct": <number>, "us_pctile": <number>, "abstain": false}
  - id: ag-corn-stocks
    asof: 2026-10-29
    files: [evals/ags/fixtures/pack-2026-10-29-ags.json]
    prompt: |
      US corn stocks on 1 September 2026 (NASS), in million bushels, and % vs the 5-year average.
      Answer: {"mbu": <number>, "vs_avg5_pct": <number>, "abstain": false}
  - id: ag-corn-condition
    asof: 2026-10-29
    files: [evals/ags/fixtures/pack-2026-10-29-ags.json]
    prompt: |
      Latest corn condition (good + excellent, %), the week it covers, and its release date.
      Answer: {"ge_pct": <number>, "week_to": "YYYY-MM-DD", "released": "YYYY-MM-DD", "abstain": false}
  - id: ag-conab-soy
    asof: 2026-10-29
    files: [evals/ags/fixtures/pack-2026-10-29-ags.json]
    prompt: |
      Conab's latest Brazil soybean production estimate: crop year, value (Mt) and survey date.
      Answer: {"crop_year": "<as printed>", "mt": <number>, "survey_date": "YYYY-MM-DD", "abstain": false}
  - id: ag-safrinha
    asof: 2026-10-29
    files: [evals/ags/fixtures/pack-2026-10-29-ags.json]
    prompt: |
      Conab's Brazil total corn and second-crop (safrinha) corn estimates for 26/27, in Mt.
      Answer: {"total_mt": <number>, "safrinha_mt": <number>, "abstain": false}
  - id: ag-corn-exports
    asof: 2026-10-29
    files: [evals/ags/fixtures/pack-2026-10-29-ags.json]
    prompt: |
      US corn export commitments for the current marketing year (Mt), the week they cover, and % vs the same week of
      prior market years.
      Answer: {"mt": <number>, "week_to": "YYYY-MM-DD", "vs_prior_pct": <number>, "abstain": false}
  - id: ag-enso
    asof: 2026-10-29
    files: [evals/ags/fixtures/pack-2026-10-29-ags.json]
    prompt: |
      Latest ONI value, the season it ends with, how many consecutive seasons are past +/-0.5, and whether CPC's
      definition of an El Nino episode (5 seasons) is met yet.
      Answer: {"oni": <number>, "season_end": "YYYY-MM", "seasons": <integer>, "episode_met": true|false, "abstain": false}
  - id: ag-drought
    asof: 2026-10-29
    files: [evals/ags/fixtures/pack-2026-10-29-ags.json]
    prompt: |
      US area in drought (D1-D4, %) on the latest map, the map date, and the value a year earlier.
      Answer: {"pct": <number>, "map_date": "YYYY-MM-DD", "year_ago_pct": <number>, "abstain": false}
  - id: ag-wasde-corn-vol
    asof: 2026-10-29
    files: [evals/ags/fixtures/pack-2026-10-29-ags.json]
    prompt: |
      Corn's volatility on WASDE days (months without Grain Stocks) vs the 10 days either side (ratio), its paired t-stat, and the number of releases.
      Answer: {"ratio": <number>, "t": <number>, "releases": <integer>, "abstain": false}
  - id: ag-sugar-wasde
    asof: 2026-10-29
    files: [evals/ags/fixtures/pack-2026-10-29-ags.json]
    prompt: |
      Do WASDE days move raw sugar No. 11 more than the days around them? Give the ratio and its t-stat.
      Answer: {"ratio": <number>, "t": <number>, "more_volatile": true|false, "abstain": false}
  - id: ag-grain-stocks-vol
    asof: 2026-10-29
    files: [evals/ags/fixtures/estimates/corn-stocks_plantings-days.json]
    prompt: |
      Corn on the March and June report days (Grain Stocks + Prospective Plantings / Acreage): the volatility ratio vs
      all other days, the local ratio vs the 10 days either side, and the number of events in the local measure.
      Answer: {"ratio_all": <number>, "ratio_local": <number>, "events_local": <integer>, "abstain": false}
  - id: ag-soy-crop-progress
    asof: 2026-10-29
    files: [evals/ags/fixtures/estimates/soybeans-crop_progress-soybeans.json]
    prompt: |
      Soybean condition surprises vs next-day CBOT soybean returns: slope per 1 sd, its t-stat, the number of reports,
      and whether the reaction is measurable (abs(t) at least 2).
      Answer: {"slope_pct": <number>, "t": <number>, "n": <integer>, "measurable": true|false, "abstain": false}
  - id: ag-wasde-eras
    asof: 2026-10-29
    sealed: true
    files: [evals/ags/fixtures/estimates/corn-wasde-days.json]
    prompt: |
      Corn's WASDE-day volatility ratio before 11 January 2013 and since (when the release moved into trading hours).
      Answer: {"before": <number>, "since": <number>, "abstain": false}
  - id: ag-iizumi
    asof: 2026-10-29
    files: [evals/ags/fixtures/knowledge/corn-drivers.md]
    prompt: |
      Per the literature size in the corn drivers, what range of change in global-mean yields does La Nina bring, and
