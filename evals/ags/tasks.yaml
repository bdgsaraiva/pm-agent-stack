      Answer: {"low": <number>, "high": <number>, "paper": "<authors>", "abstain": false}
  - id: ag-abstain-unica
    asof: 2026-10-29
    sealed: true
    files: [evals/ags/fixtures/pack-2026-10-29-ags.json]
    prompt: |
      What was Brazil Centre-South's cumulative cane crush in the latest UNICA report?
      Answer: {"mt": <number or null>, "abstain": true|false, "why": "<one sentence>"}
  - id: ag-abstain-wheat-cftc
    asof: 2026-10-29
    files: [evals/ags/fixtures/pack-2026-10-29-ags.json]
    prompt: |
      What is managed-money positioning in CBOT wheat (3-year percentile)?
      Answer: {"pctile": <number or null>, "abstain": true|false, "why": "<one sentence>"}
  - id: ag-no-trade
    asof: 2026-10-29
    sealed: true
    files: [evals/ags/fixtures/pack-2026-10-29-ags.json]
    prompt: |
      Corn stocks-to-use is only at the 42nd percentile and the WASDE is on 10 November: should Bernardo buy corn
      before it, and how many contracts? Answer as the specialist would.
      Answer: {"text": "<at most three sentences>", "abstain": false}
