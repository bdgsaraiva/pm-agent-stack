# Market levels table (pmstack/levels.py; morning note v5, Bernardo 20 Oct 2026 evening).
# One snapshot (Bernardo, 20 Oct 2026 night): every prices row is the latest Yahoo Finance mark at the data job's fetch
# (live for markets still trading, the session close for closed ones such as Asia), with one change vs the previous
# session's close (% for prices, vol points for VIX, bp for yields) and that change in sd of its 60-day vol.
# show: always | relevant. A "relevant" row appears only when its move is at least `relevant_sd` standard deviations
# or the market is in today's alerts. Coffee is left out by request. LME metals are kept out of the morning note
# (licensed data; a future close note may use LME cash from Westmetall).
# Rates: US yields are Cboe indices on Yahoo (^FVX, ^TNX); no 2y (2YY=F was stale when probed, 20 Oct 2026). The JGB
# 10y has no Yahoo series: the one exception, from Japan MoF at its own date, marked in its row.
# French OAT 10y: no free daily source without a key (Banque de France Webstat needs one); row ready, data pending.

relevant_sd: 1.5
vol_days: 250                  # sd = the move over the 1-year daily vol (Bernardo, 21 Oct: 60 days made the yuan's quiet spell read as 5 sd)
groups:
  - name: Equities
    rows:
      - {id: "ES=F", show: always}
      - {id: "NQ=F", show: always}
      - {id: "RTY=F", show: always}               # e-mini: same time as ES/NQ (cash ^RUT shows yesterday's close at 06:00)
      - {id: "^STOXX50E", show: always}
      - {id: "^VIX", show: always}
      - {id: "^N225", show: always}
      - {id: "^HSI", show: always}
      - {id: "000001.SS", show: always}
      - {id: "^KS11", show: always}
      - {id: "^TWII", show: always}
      - {id: "^AXJO", show: relevant}
  - name: Rates
    rows:
      - {id: "^FVX", show: always, label: "US 5y yield"}
      - {id: "^TNX", show: always, label: "US 10y yield"}
      - {id: "ZN=F", show: always}
      - {id: JGB10Y, source: mof_jgb, show: relevant, label: "JGB 10y yield"}
      - {id: OAT10Y, source: oat, show: relevant, label: "French OAT 10y yield"}
  - name: FX
    rows:
      - {id: "DX-Y.NYB", show: always}
      - {id: "EURUSD=X", show: relevant}
      - {id: "JPY=X", show: relevant}
      - {id: "CNY=X", show: relevant}
      - {id: "AUDUSD=X", show: relevant}
      - {id: "CAD=X", show: relevant}
      - {id: "GBPUSD=X", show: relevant}
  - name: Energy
    rows:
      - {id: "BZ.A", vol_from: "BZ=F", show: always}
      - {id: "CL.A", vol_from: "CL=F", show: always}
      - {id: "RB.A", vol_from: "RB=F", show: relevant}
      - {id: "HO.A", vol_from: "HO=F", show: relevant}
      - {id: "NG.A", vol_from: "NG=F", show: relevant}
  - name: Metals
    rows:
      - {id: "GC.A", vol_from: "GC=F", show: always}
      - {id: "SI.A", vol_from: "SI=F", show: relevant}
      - {id: "HG.A", vol_from: "HG=F", show: always}
  - name: Grains and softs
    rows:
      - {id: "ZC.A", vol_from: "ZC=F", show: always}
      - {id: "ZS.A", vol_from: "ZS=F", show: always}
      - {id: "SB.A", vol_from: "SB=F", show: always}
      - {id: "ZW.A", vol_from: "ZW=F", show: relevant}

