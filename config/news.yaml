# Narratives. Keys are Consensus-map ids (name and markets come from the map) or news-only narratives that carry
# their own `name` and `markets` until their GDELT definitions are measured and frozen (Bernardo, 20 Oct evening).
# keywords: the headline is about the narrative. reinforce / fade: cue words in that headline that point to the
# narrative gaining or losing force: a pointer for the note writer, who reads the headline and decides (inference).
# A headline with cues on both sides is "mixed"; with none, "neutral". `labels`: the words for the two directions
# [reinforce, fade] (Bernardo, 21 Oct 2026: increase/decrease, shortage/glut, bullish/bearish, hawkish/dovish, strong/weak).
narratives:
  oil_supply:
    labels: [shortage, glut]
    name: "Oil and product supply"
    markets: {"BZ.A": 1, "CL.A": 1, "HO.A": 1, "RB.A": 1}
    keywords: ["oil supply", "oil supplies", "oil exports", "crude exports", "fuel exports", "diesel exports", "oil output",
               "oil production", "crude output", refinery, refineries, refining, pipeline, "oil field", oilfield, "oil terminal",
               "export terminal", tanker, tankers, "shadow fleet", hormuz, "red sea", "oil sanctions", "russian oil", "iranian oil",
               "venezuelan oil", "libyan oil", "oil port", opec, "opec+", "force majeure", "fuel shortage", "diesel shortage",
               "strategic petroleum reserve", "energy infrastructure", "energy sites", "energy facilities"]
    reinforce: [attack, attacks, attacked, strike, strikes, drone, drones, missile, outage, outages, shut, shuts, shutdown,
                halt, halts, halted, disrupt, disrupts, disruption, disruptions, sanction, sanctions, ban, bans, embargo, cut, cuts,
                curb, curbs, blockade, seize, seized, fire, blaze, explosion, lockout, "locks out", "force majeure", mine, sank, damage,
                damaged, shortage, shortages, closure, closed]
    fade: [resume, resumes, resumed, restart, restarts, reopen, reopens, reopened, waiver, waivers, waive, waives, ease,
           eases, eased, lift, lifts, lifted, deal, ceasefire, truce, exemption, exemptions, "raise output", "boost output",
           "increase output", "output hike", record, return, returns, surplus, glut, release, releases, redundant,
           proposal, compromise, mediation, "peace deal", agreed, "agree to"]
  geopolitics:
    labels: [increase, decrease]
    name: "Geopolitical risk"
    markets: {"GC.A": 1, "BZ.A": 1, "ES=F": -1, "ZN=F": 1}
    keywords: [houthi, houthis, missile, missiles, drone, drones, airstrike, airstrikes, military, troops, invasion, war,
               ceasefire, truce, nato, hezbollah, hamas, "north korea", "taiwan strait", sabotage, explosive, "attack on",
               "attacks on", nuclear, iran, israel, ukraine, russia, pentagon, jets, warship, warships]
    reinforce: [attack, attacks, attacked, strike, strikes, escalate, escalates, escalation, deploy, deploys, deployment,
                invasion, invade, missile, missiles, drone, drones, bomb, bombs, bombing, threat, threatens, threats, killed,
                explosion, explosive, sabotage, mobilize, mobilise, war, warns, retaliation, retaliate, shot, downed]
    fade: [ceasefire, truce, "peace talks", "peace deal", talks, deal, agreement, de-escalate, de-escalation, withdraw,
           withdraws, withdrawal, pause, pauses, negotiations, negotiate, summit, "open to meeting", accord, proposal,
           compromise, mediation, mediator, mediators, approve, approval, approves, "agree to", agreed]
  oil_glut_v1:
    labels: [bigger glut, tighter]
    keywords: [glut, surplus, oversupply, "oil inventories", stockpiles, "oil demand"]
    reinforce: [glut, surplus, oversupply, build, builds, swell, swells, weak, weaker, slump, slows, "demand concerns"]
    fade: [draw, draws, deficit, tight, tighter, tightening, shortage, "strong demand"]
  china_stimulus_v1:
    labels: [more, less]
    keywords: ["china stimulus", "chinese stimulus", "beijing stimulus", pboc, "china economy", "chinese economy",
               "china growth", "china gdp", "china property"]
    reinforce: [stimulus, easing, "rate cut", cuts, support, package, boost, spending, "special bonds", injects]
    fade: [disappoint, disappoints, holds, "no stimulus", restraint, slows, slowdown, "falls short"]
  fed_policy:
    name: "Fed policy"
    labels: [hawkish, dovish]
    markets: {"ZN=F": -1, "DX-Y.NYB": 1, "ES=F": -1, "GC.A": -1}
    keywords: ["the fed", "fed's", "fed officials", "fed chair", "fed governor", "fed to", "fed will", "fed rate", "fed policy",
               fomc, "federal reserve", warsh, "rate hike", "rate hikes", "hike rates", "raise rates", "rate cut", "rate cuts",
               "cut rates", "interest rates", "policy rate", "rate path", "rate outlook"]
    reinforce: [hike, hikes, hiking, hawkish, tighten, tightening, "hot inflation", "sticky inflation", "raise rates", higher,
                "more hikes", "skip october but raise"]
    fade: [cut, cuts, cutting, dovish, pause, pauses, cools, cooling, easing, "on hold", "rate cut", lower, "no hike"]
  us_economy:
    name: "US economy"
    labels: [strong, weak]
    markets: {"ES=F": 1, "HG.A": 1, "ZN=F": -1}
    keywords: [recession, "economic slowdown", "us slowdown", "u.s. slowdown", layoffs, "job cuts", contraction,
               "pending home sales", "housing starts", "home sales", "retail sales", "jobless claims", "consumer confidence", "consumer sentiment",
               pmi, payrolls, "jobs report", gdp, "us economy", "u.s. economy", "factory activity", "consumer spending",
               "industrial production", "durable goods"]
    reinforce: [rebound, rebounds, beats, strong, stronger, accelerates, rises, rose, jumps, surge, surges, resilient,
                expands, hire, hiring, "better than expected", robust, record high]
