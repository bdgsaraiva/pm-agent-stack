# Headlines whose point is only a price move ("Gold Futures Post Back-to-Back Losses", "Stocks mostly rise as ..."):
# flagged `price_move`, so the note's Market in a Minute digests leave them out (Bernardo, 20 Oct evening).
price_move:
  subjects: [oil, crude, brent, wti, gold, silver, copper, aluminum, aluminium, "natural gas", gas, wheat, corn, soybeans,
             sugar, coffee, cocoa, stocks, stock, shares, equities, "wall street", "s&p 500", "s&p", nasdaq, dow, futures,
             treasuries, treasury, yields, bonds, bond, dollar, euro, yen, yuan, sterling, pound, currencies, bitcoin,
             markets, market, index, indexes, "oil prices", "gold prices"]
  verbs: [rise, rises, rose, fall, falls, fell, gain, gains, drop, drops, slip, slips, edge, edges, climb, climbs, jump,
          jumps, slide, slides, tumble, tumbles, rally, rallies, surge, surges, sink, sinks, dip, dips, extend, extends,
          post, posts, settle, settles, retreat, retreats, reverse, reverses, ease, eases, steady, steadies, mixed, flat,
          higher, lower, hit, hits, top, tops, soar, soars, plunge, plunges, slump, slumps, rebound, rebounds, recover,
          recovers, firm, firms, weaken, weakens, strengthen, strengthens]
  always: ["markets wrap", "stock market today", "live updates", "markets live", "stocks to watch", "earnings live", "earnings today"]

# Watches: low-frequency themes shown only when something happened (Bernardo, 20 Oct 2026 night). Matched over the
# last `window_days`, so a story stays visible for a few days; items published since the previous US close are "new".
# A headline qualifies if it has an industry word AND (an event word or a watched manager's name), or a watched
# Brazilian manager's name AND an event word, or a watched global manager's name together with a Brazil word. Pointers only: the note writer reads the headline.
