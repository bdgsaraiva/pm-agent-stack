  br_funds:
    name: "Brazil fund industry"
    window_days: 7
    industry: [gestora, gestoras, "hedge fund", "hedge funds", multimercado, multimercados, multiestratégia,
               "asset management", "gestão de recursos", "fundo de investimento", "fundos de investimento", "family office",
               "fund manager", "money manager", "investment firm", "portfolio manager", "portfolio managers", fundos,
               "gestão de fundos", "mesa de", cotistas, "devolve recursos", "devolver recursos", resgates, captação]
