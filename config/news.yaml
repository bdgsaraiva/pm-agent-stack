             "chega ao brasil", "chega ao país", "abre escritório", "abrir escritório", "escritório em são paulo",
             "escritório no brasil", contrata, contratou, "deixa a", "deixa o", "sai da", "sai do", "se junta", "vai para",
             migra, "nova gestora", "funda gestora", "lança gestora", "lança fundo", sócios, "ex-sócio", "ex-sócios",
             "opening", "opens", "closes", "shut", "shuts", "winds down", "returns capital", "hires", "poaches", "joins",
             "leaves", "launches", "expands to brazil", "enters brazil", "são paulo office", "brazil office", traz, transfere,
             transferiu, "expansão no brasil", "para o brasil", "monta time", "monta mesa", "monta equipe", "builds team",
             "builds brazil team", "indica", "entrega gestão", "deixa gestão", "acordo para comprar", "compra fatia",
             "ex-sócio", "ex-gestor", "ex-cio", "novo cio", "nova sócia", "novo sócio"]
    managers_br: [verde, spx, legacy, kapitalo, ibiuna, vinland, genoa, "absolute investimentos", "absolute pactual",
                  "jgp", "adam capital", "occam", "asa investments", "truxt", "clave capital", "patria", "vinci", "kinea",
                  "itaú asset", "btg pactual asset", "xp asset", "opportunity", "garde", "navi capital", "encore",
                  "kadima", "giant steps", "quantitas", "gávea", "gavea", "novus", "dynamo", "atmos", "squadra",
                  "velt", "alaska asset", "sharp capital", "persevera", "tork", "ace capital", "bradesco asset"]
    managers_global: [millennium, schonfeld, citadel, balyasny, point72, exodus point, exoduspoint, verition,
                      "brevan howard", bridgewater, "d.e. shaw", "two sigma", "man group", "jane street", "hudson river trading"]
