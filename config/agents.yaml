# Routing for the fundamentals pillar (agent 12 "Research": orchestrator, specialists, generalist, testing gate).
# Read by pmstack/route.py. Adding or removing a layer or a specialist is an edit here + the router prompt + a test
# run (specialists-kickoff.md section 3.1). Knowledge never lives in this file or a prompt: it lives in knowledge/.
# Architecture: docs/research/specialists-architecture.md; drawing: docs/project/architecture-total.html.

version: 1
command: /ask                 # "/ask energy: <question>" goes to one specialist; plain "/ask <question>" to the orchestrator (S6)
max_layers: 2                 # generalist -> specialists now; a complex layer (e.g. Commodities) only under the merge rule
layers: 1

orchestrator:
  status: planned             # S6
  skill: skills/orchestrator/SKILL.md
  # until S6, a question that names no single active specialist is answered by the specialist with the most keyword hits,
  # and the reply says which other specialists it would have asked
generalist:
  status: planned             # S6
  skill: skills/research-generalist/SKILL.md
  knowledge: [knowledge/commodities/cross-links.md]

# one block per specialist. status: active | planned. commodities map to knowledge folders.
specialists:
  energy:
    status: active            # S1, 24 Oct 2026
    skill: skills/specialist-energy/SKILL.md
    complex: energy
    commodities:
      crude:
        knowledge: knowledge/energy/crude
        refs: [BZ=F, CL=F]
        keywords: [crude, oil, brent, wti, cushing, opec, opec+, refinery runs, spr, barrel, dated brent, hormuz, shale, rig count, eia]
      products:
        knowledge: knowledge/energy/products
        refs: [RB=F, HO=F]
        keywords: [gasoline, rbob, diesel, distillate, ulsd, heating oil, jet, crack, cracks, refining margin, products]
      natgas:
        knowledge: knowledge/energy/natgas
        refs: [NG=F]
        keywords: [natural gas, natgas, henry hub, lng, storage report, ttf, heating degree, cooling degree]
  metals:
    status: planned           # S3
    skill: skills/specialist-metals/SKILL.md
    complex: metals
    commodities:
      gold: {knowledge: knowledge/metals/gold, refs: [GC=F], keywords: [gold, bullion, central bank buying, etf holdings]}
      copper: {knowledge: knowledge/metals/copper, refs: [HG=F], keywords: [copper, comex copper, lme copper, shfe]}
      aluminium: {knowledge: knowledge/metals/aluminium, refs: [], keywords: [aluminium, aluminum, alumina, bauxite]}
      iron_ore: {knowledge: knowledge/metals/iron_ore, refs: [], keywords: [iron ore, steel, dalian]}
  ags:
    status: planned           # S4 (needs USDA_FAS_API_KEY and NASS_API_KEY; both set 15 Oct)
    skill: skills/specialist-ags/SKILL.md
    complex: ags
    commodities:
      corn: {knowledge: knowledge/ags/corn, refs: [ZC=F], keywords: [corn, maize, ethanol]}
      soybeans: {knowledge: knowledge/ags/soybeans, refs: [ZS=F], keywords: [soybeans, soybean, soy, soymeal, soyoil, crush]}
      wheat: {knowledge: knowledge/ags/wheat, refs: [ZW=F], keywords: [wheat, srw, hrw, black sea grain]}
      sugar: {knowledge: knowledge/ags/sugar, refs: [SB=F], keywords: [sugar, unica, cane, raw sugar]}
  macro:
    status: planned           # S5 (lighter: context for commodities)
    skill: skills/specialist-macro/SKILL.md
    complex: macro
    commodities:
      us_rates: {knowledge: knowledge/macro/us_rates, refs: [ZN=F], keywords: [fed, treasury, yields, 10y, 2y, rates, fomc, curve steepening]}
      usd: {knowledge: knowledge/macro/usd, refs: [DX-Y.NYB], keywords: [dollar, usd, dxy, eur/usd, usd/jpy]}
      us_equities: {knowledge: knowledge/macro/us_equities, refs: [ES=F, NQ=F], keywords: [s&p, spx, nasdaq, equities, stocks, earnings]}

# question types: what the question is about. The router tags it; the specialist loads only the matching knowledge files.
question_types:
  balance: {files: [balance.md, drivers.md], keywords: [stocks, inventories, inventory, balance, supply, demand, draw, build, days of supply, stocks-to-use, tight, loose]}
  curve: {files: [primer.md, drivers.md], keywords: [curve, spread, timespread, backwardation, contango, roll, carry, crack, basis]}
  event: {files: [events.md], keywords: [report, release, wpsr, eia report, steo, opec meeting, wasde, playbook, what to expect]}
  positioning: {files: [drivers.md], keywords: [positioning, cftc, managed money, crowded, cot]}
  analogue: {files: [analogues.md], keywords: [analogue, analog, like in, last time, history, episode, precedent]}
  driver: {files: [drivers.md, open-questions.md], keywords: [why, driver, drives, sensitivity, elasticity, what moves]}

# questions that belong to another pillar: the router says so and points to it instead of asking a specialist
other_pillars:
  narratives: {agent: 7, how: "/narratives or the Consensus map in facts.md", keywords: [narrative, story, consensus, headline, news theme]}
  quant: {agent: 13, how: "the tape card (S2); until then the Risk and crowding section", keywords: [trend, cta, momentum, vol, volatility, options, skew, correlation, seasonality, regime]}
