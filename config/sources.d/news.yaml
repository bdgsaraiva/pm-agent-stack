# Market news headlines (morning note v4, 20 Oct 2026). Merged into config/sources.yaml by pmstack/fetch.py.
# Outlets chosen to match the sources Bernardo's model notes cite most (FT, Reuters, Bloomberg, WSJ, CNBC, NYT,
# Axios, Politico, MarketWatch) plus commodity specialists and official releases. Public RSS only; feeds probed
# 20 Oct 2026 (CNN's feeds are stale since 2023; OPEC, USDA, Treasury and MINING.COM refuse scripted requests).
# Stored: title, link, outlet, time. No article text, no summary (keep_summary: false), personal research use.
# Reuters has no public RSS: its headlines come through Google News search feeds (links redirect to reuters.com).

news:
  adapter: rss
  keep_summary: false
  strip_suffix: true          # Google News titles end in " - Reuters"; the outlet comes from the feed id
                              # (or, with outlet_from_source, from each item's Google News <source>)
  keep_days: 45               # weeks of headlines for the 7-day baselines; the file is committed daily
  feeds:
    - {id: reuters_markets,   outlet: Reuters,     url: "https://news.google.com/rss/search?q=when:1d+site:reuters.com+(markets+OR+stocks+OR+bonds+OR+dollar+OR+Fed)&hl=en-US&gl=US&ceid=US:en"}
    - {id: reuters_commods,   outlet: Reuters,     url: "https://news.google.com/rss/search?q=when:1d+site:reuters.com+(oil+OR+OPEC+OR+gas+OR+gold+OR+copper+OR+wheat+OR+corn+OR+soybeans+OR+sugar+OR+coffee)&hl=en-US&gl=US&ceid=US:en"}
    - {id: reuters_world,     outlet: Reuters,     url: "https://news.google.com/rss/search?q=when:1d+site:reuters.com+(Iran+OR+Russia+OR+Ukraine+OR+China+OR+sanctions+OR+tariffs)&hl=en-US&gl=US&ceid=US:en"}
    - {id: bloomberg_markets, outlet: Bloomberg,   url: "https://feeds.bloomberg.com/markets/news.rss"}
    - {id: bloomberg_economics, outlet: Bloomberg, url: "https://feeds.bloomberg.com/economics/news.rss"}
    - {id: bloomberg_politics, outlet: Bloomberg,  url: "https://feeds.bloomberg.com/politics/news.rss"}
    - {id: bloomberg_tech,    outlet: Bloomberg,   url: "https://feeds.bloomberg.com/technology/news.rss"}
    - {id: ft_home,           outlet: FT,          url: "https://www.ft.com/rss/home"}
    - {id: ft_markets,        outlet: FT,          url: "https://www.ft.com/markets?format=rss"}
    - {id: ft_commodities,    outlet: FT,          url: "https://www.ft.com/commodities?format=rss"}
    - {id: ft_world,          outlet: FT,          url: "https://www.ft.com/world?format=rss"}
    - {id: wsj_markets,       outlet: WSJ,         url: "https://feeds.content.dowjones.io/public/rss/RSSMarketsMain"}
    - {id: wsj_world,         outlet: WSJ,         url: "https://feeds.content.dowjones.io/public/rss/RSSWorldNews"}
    - {id: wsj_economy,       outlet: WSJ,         url: "https://feeds.content.dowjones.io/public/rss/socialeconomyfeed"}
    - {id: wsj_business,      outlet: WSJ,         url: "https://feeds.content.dowjones.io/public/rss/WSJcomUSBusiness"}
    - {id: marketwatch,       outlet: MarketWatch, url: "https://feeds.content.dowjones.io/public/rss/mw_topstories"}
    - {id: cnbc_top,          outlet: CNBC,        url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114"}
    - {id: cnbc_energy,       outlet: CNBC,        url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=19836768"}
    - {id: cnbc_economy,      outlet: CNBC,        url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258"}
    - {id: nyt_business,      outlet: NYT,         url: "https://rss.nytimes.com/services/xml/rss/nyt/Business.xml"}
    - {id: nyt_economy,       outlet: NYT,         url: "https://rss.nytimes.com/services/xml/rss/nyt/Economy.xml"}
    - {id: nyt_world,         outlet: NYT,         url: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml"}
    - {id: axios,             outlet: Axios,       url: "https://api.axios.com/feed/"}
    - {id: politico,          outlet: Politico,    url: "https://rss.politico.com/politics-news.xml"}
    - {id: bbc_business,      outlet: BBC,         url: "https://feeds.bbci.co.uk/news/business/rss.xml"}
    - {id: oilprice,          outlet: OilPrice.com, url: "https://oilprice.com/rss/main"}
    - {id: eia_today,         outlet: EIA,         url: "https://www.eia.gov/rss/todayinenergy.xml"}
    - {id: fed_speeches,      outlet: Federal Reserve, url: "https://www.federalreserve.gov/feeds/speeches.xml"}

    # Middle East diplomacy, Iran, Pakistan, the Gulf and oil supply (added 20 Oct 2026 after the US-Iran deal report
    # (Qatar-Pakistan proposal, ~13:00 UTC) and its denial (~15:15 UTC) moved oil while the feeds above caught neither).
    # Probed 20 Oct 2026. High-volume outlets come through Google News site: queries (up to 100 items a day; their own
    # feeds stop at 15-25 items, less than a day at a once-a-day fetch). Al Arabiya, Arab News and The New Arab refuse
    # scripted requests (403); Press TV's own feed has no dates; Tasnim is unreachable from this PC (and from Google News).
    # Iranian official media are labelled as such: the denial came from Iranian sources.
    - {id: ap_mideast,        outlet: "AP", url: "https://news.google.com/rss/search?q=when:1d+site:apnews.com+(Iran+OR+Israel+OR+Gaza+OR+Lebanon+OR+Hormuz+OR+Gulf+OR+Saudi+OR+Qatar+OR+Oman+OR+UAE+OR+Yemen+OR+Houthi+OR+Iraq+OR+Pakistan+OR+oil+OR+OPEC+OR+tanker+OR+LNG)&hl=en-US&gl=US&ceid=US:en"}
    - {id: aljazeera,         outlet: "Al Jazeera", url: "https://news.google.com/rss/search?q=when:1d+site:aljazeera.com+(Iran+OR+Israel+OR+Gaza+OR+Lebanon+OR+Hormuz+OR+Gulf+OR+Saudi+OR+Qatar+OR+Oman+OR+UAE+OR+Yemen+OR+Houthi+OR+Iraq+OR+Pakistan+OR+oil+OR+OPEC+OR+tanker+OR+LNG)&hl=en-US&gl=US&ceid=US:en"}
    - {id: investinglive,     outlet: "investingLive", url: "https://news.google.com/rss/search?q=when:1d+site:investinglive.com&hl=en-US&gl=US&ceid=US:en"}
    - {id: dawn,              outlet: "Dawn", url: "https://news.google.com/rss/search?q=when:1d+site:dawn.com+(Iran+OR+Tehran+OR+Washington+OR+Qatar+OR+Saudi+OR+Gulf+OR+oil+OR+mediation+OR+%22army+chief%22)&hl=en-US&gl=US&ceid=US:en"}
    - {id: tribune_pk,        outlet: "The Express Tribune", url: "https://news.google.com/rss/search?q=when:1d+site:tribune.com.pk+(Iran+OR+Tehran+OR+Washington+OR+Qatar+OR+Saudi+OR+Gulf+OR+oil+OR+mediation+OR+%22army+chief%22)&hl=en-US&gl=US&ceid=US:en"}
    - {id: arabnews,          outlet: "Arab News", url: "https://news.google.com/rss/search?q=when:1d+site:arabnews.com&hl=en-US&gl=US&ceid=US:en"}
    - {id: arabnews_pk,       outlet: "Arab News PK", url: "https://news.google.com/rss/search?q=when:1d+site:arabnews.pk&hl=en-US&gl=US&ceid=US:en"}
    - {id: alarabiya,         outlet: "Al Arabiya English", url: "https://news.google.com/rss/search?q=when:1d+site:english.alarabiya.net&hl=en-US&gl=US&ceid=US:en"}
    - {id: timesofisrael,     outlet: "The Times of Israel", url: "https://news.google.com/rss/search?q=when:1d+site:timesofisrael.com+(Iran+OR+Israel+OR+Gaza+OR+Lebanon+OR+Hormuz+OR+Gulf+OR+Saudi+OR+Qatar+OR+Oman+OR+UAE+OR+Yemen+OR+Houthi+OR+Iraq+OR+Pakistan+OR+oil+OR+OPEC+OR+tanker+OR+LNG)&hl=en-US&gl=US&ceid=US:en"}
    - {id: middleeasteye,     outlet: "Middle East Eye", url: "https://news.google.com/rss/search?q=when:1d+site:middleeasteye.net&hl=en-US&gl=US&ceid=US:en"}
    - {id: newarab,           outlet: "The New Arab", url: "https://news.google.com/rss/search?q=when:1d+site:newarab.com&hl=en-US&gl=US&ceid=US:en"}
    - {id: presstv,           outlet: "Press TV (Iranian state media)", url: "https://news.google.com/rss/search?q=when:1d+site:presstv.ir&hl=en-US&gl=US&ceid=US:en"}
    - {id: iranintl,          outlet: "Iran International", url: "https://www.iranintl.com/en/feed"}
    - {id: thenational,       outlet: "The National",       url: "https://www.thenationalnews.com/arc/outboundfeeds/rss/?outputType=xml"}
    - {id: irna,              outlet: "IRNA (Iranian state media)", url: "https://en.irna.ir/rss"}
    - {id: mehr,              outlet: "Mehr (Iranian semi-official media)", url: "https://en.mehrnews.com/rss"}
    # Topic queries across outlets: each item keeps its real outlet (Google News <source>, renamed by outlet_alias).
    - {id: gn_iran_talks,     outlet_from_source: true, url: "https://news.google.com/rss/search?q=when:1d+Iran+(talks+OR+deal+OR+proposal+OR+mediation+OR+mediator+OR+ceasefire+OR+nuclear+OR+sanctions+OR+Araghchi+OR+Witkoff)&hl=en-US&gl=US&ceid=US:en"}
    - {id: gn_gulf_supply,    outlet_from_source: true, url: "https://news.google.com/rss/search?q=when:1d+(Hormuz+OR+tanker+OR+%22Red+Sea%22+OR+Houthi+OR+Aramco+OR+%22OPEC%2B%22+OR+%22oil+supply%22+OR+%22Persian+Gulf%22)&hl=en-US&gl=US&ceid=US:en"}
  # Google News <source> names → the outlet names used above (and in config/news.yaml tiers); Iranian official media labelled;
  # names not listed keep Google News's own (unknown outlets get tier 3).
  outlet_alias:
    "Bloomberg.com": "Bloomberg"
    "Financial Times": "FT"
    "The Wall Street Journal": "WSJ"
    "The New York Times": "NYT"
    "POLITICO": "Politico"
    "AP News": "AP"
    "IRNA English": "IRNA (Iranian state media)"
    "IRNA": "IRNA (Iranian state media)"
    "Islamic Republic News Agency": "IRNA (Iranian state media)"
    "PressTV": "Press TV (Iranian state media)"
    "Press TV": "Press TV (Iranian state media)"
    "Mehr News Agency": "Mehr (Iranian semi-official media)"
    "Tasnim News Agency": "Tasnim (IRGC-affiliated media)"
    "Fars News Agency": "Fars (IRGC-affiliated media)"
    "Tehran Times": "Tehran Times (Iranian state media)"
    "ISNA": "ISNA (Iranian semi-official media)"
