# Alert thresholds for the commodity supply-demand + central-bank monitor.
# Alerts are prompts to look, not signals. Nothing here is a trading rule until it
# passes the quant-research gate (Step 6).

eia:
  seasonal_years: 5          # compare weekly change with the same ISO week over the past 5 years
  surprise_z: 1.5            # alert when (change - seasonal mean) / seasonal std exceeds this
cftc:
  lookback_weeks: 156        # 3 years
  extreme_pct: 90            # alert above this percentile (or below 100 - this) of managed-money net / OI
  weekly_change_z: 2.0
prices:
  vol_window: 60             # trading days for return volatility
  move_z: 2.0                # alert when 1-day return / trailing vol exceeds this
fred:
  move_z: 2.0
bcb:
  focus_change_bp: 10        # alert when a Focus median moves this much week on week (in bp / centavos x100)
cbtext:
  lookback_hours: 36         # items published in this window count as new
staleness:
  # Max age in calendar days before a series is flagged stale in the data-health section
  daily: 5
  weekly: 10
  monthly: 75               # monthly series are dated at period start and published with a lag
# Consensus and narrative monitor (agent 7). Descriptive only. Evidence: docs/research/consensus.md
consensus:
  level_days: 28             # "last 4 weeks"
  base_days: 182             # "prior 26 weeks"
  spread_up: 0.4             # ln(level / base) above this, rising 2 of 3 weeks -> spreading
  spread_down: -0.4          # below this -> fading
  peak_drop: 0.30            # last week >30% below the 8-week peak -> fading
  peaking_pct: 80            # 4-week level at/above this percentile of history -> peaking
  dormant_pct: 20
  min_daily_articles: 20     # below this average -> "insufficient coverage"
  gap_norm_drop: 0.40        # day dropped when GDELT's total falls this far below its 28-day median
  min_history_days: 240      # need this many days before stages are computed
  stale_days: 4              # no stage when the narrative's last data day is older than this (outage, failed fetch)
  instruments: [gdeltbqt, gdeltbq, gdelt]  # per narrative, the first with a computed stage wins (GKG title-or-path, GKG path, DOC API); never mixed
  headline_window_days: 7    # headline links: the last 7 data days of the narrative
  headlines_per_narrative: 3 # the note links at most 3 per narrative that changed stage
  tracker_rebuild_days: 180  # narrative tracker: stage history rebuilt from stored series when a record starts
  tracker_keep_changes: 40
  trend_days: [21, 63, 252]  # 1/3/12-month signs (Hurst, Ooi & Pedersen)
  vol_span: 60               # EWMA span for the capped strength score
  crowded_pct: 90            # CFTC 3-year percentile on a side
  cftc_release_lag_days: 3   # Tuesday data count from the Friday release (same rule as risk.py)
  leaning_pct: 70
  cb_terms: [inflation, "labor market", tariff, tariffs, "financial stability", "balance sheet", "rate increase",
             "rate cut", uncertainty, "energy prices", "oil prices", recession, "price stability"]
  cb_sources: [fed]
  unvalidated_note: "unvalidated: not yet checked against GPR/EPU or a headline audit"
  caption_cftc: "CFTC as of Tuesday, published Friday; managed money includes discretionary funds (not only CTAs); crowding context, not a forecast."
  caption_trend: "Trend proxy = average sign of 1/3/12-month returns on front-month closes (roll gaps not adjusted); describes what trend followers likely hold, not a forecast."
