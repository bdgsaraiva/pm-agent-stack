# Data sources for the research memory.
# Each adapter is swappable: replace `adapter:` with a vendor adapter (TT, Koyfin, Bloomberg...)
# that returns the same columns, and nothing downstream changes.
# Personal build: free public sources only.

eia:
  adapter: eia
  frequency: weekly          # Weekly Petroleum Status Report, Wednesdays 10:30 ET
  backfill_start: "2018-01-01"
  series:
    - {id: PET.WCESTUS1.W,  name: "US crude stocks ex SPR",        unit: kbbl}
    - {id: PET.W_EPC0_SAX_YCUOK_MBBL.W, name: "Cushing crude stocks", unit: kbbl}
    - {id: PET.WGTSTUS1.W,  name: "US gasoline stocks",            unit: kbbl}
    - {id: PET.WDISTUS1.W,  name: "US distillate stocks",          unit: kbbl}
    - {id: PET.WPULEUS3.W,  name: "US refinery utilisation",       unit: pct}
    - {id: PET.WCRFPUS2.W,  name: "US crude production",           unit: kbd}
    - {id: PET.WCREXUS2.W,  name: "US crude exports",              unit: kbd}
    - {id: PET.WCSSTUS1.W,  name: "US SPR stocks",                 unit: kbbl}

cftc:
  adapter: cftc              # Disaggregated futures-only, released Fridays 15:30 ET for Tuesday
  dataset: 72hh-3qpy
  backfill_start: "2020-01-01"
  markets:
    - {code: "067651", name: "WTI crude (NYMEX)"}
    - {code: "023651", name: "Natural gas (NYMEX Henry Hub)"}
    - {code: "111659", name: "RBOB gasoline (NYMEX)"}
    - {code: "022651", name: "ULSD heating oil (NYMEX)"}
    - {code: "088691", name: "Gold (COMEX)"}
    - {code: "085692", name: "Copper (COMEX)"}
    - {code: "005602", name: "Soybeans (CBOT)"}
    - {code: "002602", name: "Corn (CBOT)"}
    - {code: "080732", name: "Sugar No. 11 (ICE US)"}
    - {code: "083731", name: "Coffee C (ICE US)"}

fred:
  adapter: fred              # Uses FRED_API_KEY if set, else the public CSV endpoint
  backfill_start: "2018-01-01"
  history_start: "1986-01-01"   # one-time deep history for agent 8's stress replays (each series fetched once)
  series:
    - {id: DCOILBRENTEU, name: "Brent spot (EIA via FRED)",   unit: usd_bbl}
    - {id: DCOILWTICO,   name: "WTI spot (EIA via FRED)",     unit: usd_bbl}
    - {id: DHHNGSP,      name: "Henry Hub spot",              unit: usd_mmbtu}
    - {id: DGS2,         name: "US 2y Treasury yield",        unit: pct}
    - {id: DGS10,        name: "US 10y Treasury yield",       unit: pct}
    - {id: DGS30,        name: "US 30y Treasury yield",       unit: pct}
    - {id: T10Y2Y,       name: "US 2s10s curve",              unit: pct}
    - {id: DFII10,       name: "US 10y real yield (TIPS)",    unit: pct}
    - {id: T10YIE,       name: "US 10y breakeven inflation",  unit: pct}
    - {id: SOFR,         name: "SOFR",                        unit: pct}
    - {id: BAMLH0A0HYM2, name: "US high-yield OAS",           unit: pct}
    - {id: DTWEXBGS,     name: "Broad trade-weighted USD",    unit: index, freq: weekly}
    # Long-history proxies for agent 8's stress replays only (not shown in the fact pack's macro table)
    - {id: VIXCLS,       name: "VIX close (Cboe via FRED)",   unit: index, risk_only: true}
    - {id: DHOILNYH,     name: "NY Harbor heating oil spot",  unit: usd_gal, risk_only: true}
    - {id: DGASNYH,      name: "NY Harbor gasoline spot",     unit: usd_gal, risk_only: true}

# bcb: Brazil (SGS + Focus) adapter exists in pmstack/adapters/bcb.py; disabled 9 Oct 2026 (focus moved to
# commodities, US equities and US macro). Restore the block from git history to re-enable.

prices:
  adapter: yahoo             # Unofficial, personal use only. Replace with TT / vendor in corporate build.
  backfill_start: "2023-01-01"
  history_start: "1986-01-01"   # one-time deep history for agent 8 (futures exist from ~2000; indices earlier)
  tickers:
    # Commodities (front month, continuous)
    - {id: "BZ=F",  name: "Brent front month",      group: energy}
    - {id: "CL=F",  name: "WTI front month",        group: energy}
    - {id: "NG=F",  name: "Henry Hub front month",  group: energy}
    - {id: "HO=F",  name: "ULSD front month",       group: energy}
    - {id: "RB=F",  name: "RBOB front month",       group: energy}
    - {id: "GC=F",  name: "Gold front month",       group: metals}
    - {id: "HG=F",  name: "Copper front month",     group: metals}
    - {id: "ZS=F",  name: "Soybeans front month",   group: ags}
    - {id: "ZC=F",  name: "Corn front month",       group: ags}
    - {id: "KC=F",  name: "Coffee front month",     group: ags}
    - {id: "SB=F",  name: "Sugar front month",      group: ags}
    - {id: "SI=F",  name: "Silver front month",     group: metals}
    - {id: "ZW=F",  name: "Wheat front month",      group: ags}
    # Asia session = "overnight"
    - {id: "^N225", name: "Nikkei 225",             group: asia}
    - {id: "^HSI",  name: "Hang Seng",              group: asia}
    - {id: "000001.SS", name: "Shanghai Composite", group: asia}
    - {id: "^KS11", name: "KOSPI",                  group: asia}
    - {id: "^AXJO", name: "ASX 200",                group: asia}
    # US equities
    - {id: "^GSPC", name: "S&P 500",                group: us_equity}
    - {id: "^NDX",  name: "Nasdaq 100",             group: us_equity}
    - {id: "^RUT",  name: "Russell 2000",           group: us_equity}
    - {id: "^VIX",  name: "VIX",                    group: us_equity}
    - {id: "XLE",   name: "Energy sector (XLE)",    group: us_equity}
    - {id: "XLB",   name: "Materials sector (XLB)", group: us_equity}
    - {id: "ES=F",  name: "S&P 500 e-mini",         group: us_equity}
    - {id: "NQ=F",  name: "Nasdaq 100 e-mini",      group: us_equity}
    # US rates (futures, for the overnight move; cash yields come from FRED)
    - {id: "ZN=F",  name: "10y T-note future",      group: rates}
    - {id: "ZT=F",  name: "2y T-note future",       group: rates}
    # USD
    - {id: "DX-Y.NYB", name: "US dollar index",     group: fx}
    - {id: "EURUSD=X", name: "EUR/USD",             group: fx}
    - {id: "JPY=X",  name: "USD/JPY",               group: fx}
    - {id: "CNY=X",  name: "USD/CNY",               group: fx}
    - {id: "AUDUSD=X", name: "AUD/USD",             group: fx}

cbtext:
  adapter: rss               # Central-bank and policy text
  feeds:
    - {id: fed,  name: "Federal Reserve press releases", url: "https://www.federalreserve.gov/feeds/press_all.xml"}
    - {id: ecb,  name: "ECB press releases",             url: "https://www.ecb.europa.eu/rss/press.html"}
    - {id: boe,  name: "Bank of England news",           url: "https://www.bankofengland.co.uk/rss/news"}
    - {id: boj,  name: "Bank of Japan what's new",       url: "https://www.boj.or.jp/en/rss/whatsnew.xml"}
  # Whole-word, case-insensitive.
  keywords: [rate, rates, monetary, policy, statement, minutes, fomc, inflation, decision, balance sheet, yield curve, intervention, governing council, mpc, discount rate, beige book, testimony]

gdelt:
  adapter: gdelt             # GDELT DOC 2.0 API, free and keyless; cite "The GDELT Project" with a link
  backfill_start: "2017-01-01"
  pause_seconds: 6           # one request every 6 s (5 s cited) (third-party guidance; not stated officially)
  max_minutes: 3             # 20 Oct: 3 (was 12). Every narrative is measured on BigQuery now; the DOC API answers 429 to
                             # GitHub runners, and its 12 minutes pushed the job toward its timeout
  backoff_seconds: 30        # wait 30 s, then 60 s, after a refused call (HTTP 429 seen in the first live run)
  max_consecutive_failures: 3  # calls failing in a row (after retries) before the run stops asking
  overlap_days: 10           # each query refetches from its own last stored day minus this
  # Frozen narrative queries (agent 7). Edit = new id/version, so a series never changes meaning.
  # markets: price series the narrative pushes and which way (+1 up, -1 down). Labels for the map only.
  # Syntax: "phrase", (a OR b) blocks (not nested), -exclusion. Evidence: docs/research/consensus.md
  queries:
    # retired 20 Oct 2026: redesigned (Bernardo, 20 Oct evening) into 'Oil and product supply' (oil_supply) and 'Geopolitical risk' (geopolitics); history kept
    - {id: hormuz_iran_v1, retired: true, name: "Hormuz / Iran oil supply", markets: {"BZ=F": 1, "CL=F": 1},
       query: '("Strait of Hormuz" OR "Iranian oil" OR "Iran oil exports" OR "Persian Gulf tanker")'}
    # v1 retired 15 Oct 2026: the DOC API rejects the quoted "OPEC+" ("The specified phrase is too short").
    # v2 keeps the meaning: every "OPEC+" article also contains the word OPEC.
    - {id: opec_supply_v1, name: "OPEC+ supply policy (v1, retired)", markets: {"BZ=F": 1, "CL=F": 1}, retired: true,
       query: '(OPEC OR "OPEC+") ("output cut" OR "production cut" OR "supply cut" OR "output quota")'}
    # retired 20 Oct 2026 (Bernardo, first /narratives review): headline audit 20% on topic, tight definitions under the floor; history kept, discovery nominates bursts
    - {id: opec_supply_v2, retired: true, name: "OPEC+ supply policy", markets: {"BZ=F": 1, "CL=F": 1},
       query: 'OPEC ("output cut" OR "production cut" OR "supply cut" OR "output quota")'}
    - {id: oil_glut_v1, name: "Oil glut / surplus", markets: {"BZ=F": -1, "CL=F": -1},
       query: '("oil glut" OR "oil surplus" OR "crude glut" OR "oversupplied oil market")'}
    # retired 20 Oct 2026: redesigned (Bernardo, 20 Oct evening) into 'Oil and product supply' (oil_supply) and 'Geopolitical risk' (geopolitics); history kept
    - {id: russia_oil_v1, retired: true, name: "Russian oil sanctions", markets: {"BZ=F": 1, "HO=F": 1},
       query: '("Russian oil" OR "Russian crude") (sanctions OR "price cap")'}
    # retired 20 Oct 2026: removed from the map (Bernardo, 20 Oct evening); history kept
    - {id: us_gasoline_v1, retired: true, name: "US pump prices", markets: {"RB=F": 1},
       query: '("gasoline prices" OR "gas prices" OR "pump prices") sourcecountry:US'}
    - {id: natgas_lng_v1, name: "Natural gas / LNG", markets: {"NG=F": 1},
       query: '("natural gas prices" OR "LNG exports" OR "Henry Hub" OR "gas shortage")'}
    - {id: china_stimulus_v1, name: "China stimulus", markets: {"HG=F": 1, "BZ=F": 1, "ZS=F": 1},
       query: '("China stimulus" OR "Chinese stimulus" OR "Beijing stimulus" OR "PBOC easing")'}
    # retired 20 Oct 2026 (Bernardo, first /narratives review): headline audit 16% on topic, tight definitions under the floor; history kept, discovery nominates bursts
    - {id: copper_shortage_v1, retired: true, name: "Copper shortage / AI power demand", markets: {"HG=F": 1},
       query: '("copper shortage" OR "copper deficit" OR "copper demand" OR "copper supply")'}
    # retired 20 Oct 2026 (Bernardo, first /narratives review): headline audit 44% on topic, tight definitions under the floor; history kept, discovery nominates bursts
    - {id: gold_buying_v1, retired: true, name: "Gold buying / reserves", markets: {"GC=F": 1},
       query: '("central bank gold" OR "gold reserves" OR "gold buying" OR "gold rally")'}
    # retired 20 Oct 2026 (Bernardo, first /narratives review): headline audit 44% on topic, tight definitions under the floor; history kept, discovery nominates bursts
    - {id: crop_weather_v1, retired: true, name: "Crop weather / drought", markets: {"ZC=F": 1, "ZS=F": 1, "ZW=F": 1},
       query: '(drought OR "crop weather" OR "heat wave" OR "crop damage") (corn OR soybeans OR wheat)'}
    # retired 20 Oct 2026: removed from the map (Bernardo, 20 Oct evening); history kept
    - {id: trade_war_v1, retired: true, name: "Trade war / tariffs", markets: {"ES=F": -1, "ZS=F": -1, "HG=F": -1},
       query: '("trade war" OR "new tariffs" OR "tariff hike" OR "retaliatory tariffs")'}
    - {id: fed_hike_v1, name: "Fed hikes", markets: {"ZN=F": -1, "ES=F": -1, "DX-Y.NYB": 1, "GC=F": -1},
       query: '("Federal Reserve" OR "the Fed") ("rate hike" OR "raise rates" OR "further tightening")'}
    - {id: fed_cut_v1, name: "Fed cuts", markets: {"ZN=F": 1, "ES=F": 1, "DX-Y.NYB": -1, "GC=F": 1},
       query: '("Federal Reserve" OR "the Fed") ("rate cut" OR "cut rates" OR "monetary easing")'}
    # retired 20 Oct 2026: removed from the map (Bernardo, 20 Oct evening); history kept
    - {id: inflation_scare_v1, retired: true, name: "Inflation scare", markets: {"GC=F": 1, "ZN=F": -1},
       query: '("inflation fears" OR "sticky inflation" OR "inflation surge" OR "inflation accelerates")'}
    - {id: recession_v1, name: "Recession fears", markets: {"ES=F": -1, "ZN=F": 1, "HG=F": -1, "BZ=F": -1},
       query: '("recession fears" OR "recession risk" OR "economic slowdown" OR "hard landing")'}
    - {id: ai_bubble_v1, name: "AI bubble", markets: {"NQ=F": -1, "ES=F": -1},
       query: '("AI bubble" OR "artificial intelligence bubble" OR "AI stocks selloff")'}
    # 20 Oct 2026 (Bernardo: the AI correction is a major theme the map missed): broader than ai_bubble_v1. Measured
    # only on the v2 BigQuery instrument (bq_only: the DOC API and the title-or-path instrument skip it).
    - {id: ai_trade_v1, name: "AI trade scare / chip selloff", bq_only: true,
       markets: {"NQ=F": -1, "ES=F": -1, "^KS11": -1, "ZN=F": 1},
       query: '("AI stocks" OR "AI trade" OR "chip stocks" OR semiconductor OR "data center") (selloff OR rout OR slump OR plunge OR bubble OR worries)'}
    - {id: weak_dollar_v1, name: "Weak dollar / de-dollarisation", markets: {"DX-Y.NYB": -1, "GC=F": 1},
       query: '("weaker dollar" OR "dollar weakness" OR "dollar slump" OR "de-dollarization")'}
    - {id: us_fiscal_v1, name: "US fiscal stress", markets: {"ZN=F": -1, "GC=F": 1},
       query: '("budget deficit" OR "debt ceiling" OR "bond vigilantes" OR "Treasury selloff") (US OR "United States")'}
    # Validation only (later, with EPU): Baker-Bloom-Davis style conjunction
    - {id: epu_replica_v1, name: "EPU replica (validation)", markets: {}, validation: true,
       query: '(economy OR economic) (policy OR regulation OR "Federal Reserve") (uncertainty OR uncertain)'}

gdelt_bq:
  adapter: gdelt_bq          # GDELT GKG via BigQuery (secrets GCP_SA_KEY, GCP_PROJECT_ID; GitHub Actions only). Cite "The GDELT Project"
  queries_from: gdelt        # the same frozen narrative queries
  match: title_or_path       # page title (GKG Extras) or URL path. 15 Oct: path-only (series gdeltbq:*, kept, no longer
  series_prefix: gdeltbqt    # updated) left 14 of 18 narratives under 20 articles a day; the title costs ~0.17 GB a day
  table: gdelt-bq.gdeltv2.gkg_partitioned   # partitioned by ingest day: filter on _PARTITIONTIME, one day = one partition
  backfill_start: "2025-08-01"  # ~14 months: enough for 240 valid days plus the 26-week base window
  days_per_query: 14         # backfill chunk (halved automatically when a chunk does not fit the budget)
  overlap_days: 0            # 20 Oct: 0 (was 3). Partitions are by ingest day; a complete past day never changes
  max_gb_query: 60           # maximum_bytes_billed per query (after a dry run)
  max_gb_run: 150            # per daily run
  max_gb_month: 800          # of the BigQuery sandbox's free 1 TiB a month (ledger: data/obs/gdelt_bq/_bytes.json)
  max_gb_day: 32             # 4% of the month a business day, shared by all BigQuery users; bulk work leaves 4 GB (gdelt_bq.DAY_CAP_GB)
  max_minutes: 10
  headline_days: 3           # complete days, back from yesterday, that get headlines when missing
  headlines_per_day: 5       # distinct titles per narrative and day, ranked by copies (title, source, URL, date only)

gdelt_bq_v2:
  adapter: gdelt_bq          # same adapter, table, caps and byte ledger as gdelt_bq; its own frozen definitions below
  store_key: gdelt_bq_v2     # data/obs/gdelt_bq_v2/; series gdeltbq2:<id>:count|share|tone, gdeltbq2:norm
  series_prefix: gdeltbq2
  match: title_or_path       # words: page title or URL path; theme:NAME = GKG Themes list (tagged from the full text)
  table: gdelt-bq.gdeltv2.gkg_partitioned
  backfill_start: "2025-08-01"
  days_per_query: 14
  overlap_days: 0            # see gdelt_bq
  fill_days: 300             # queries added later are filled 300 days back (stages need 240 valid days + base)
  max_gb_query: 60
  max_gb_run: 150            # ~0.36 GB a day (title, URL, tone, Themes): the backfill takes two runs
  max_gb_month: 800
  max_minutes: 10
  headline_days: 3
  headlines_per_day: 5
  # Frozen v2 definitions (16 Oct 2026), one per narrative it measures (`narrative:` = the narrative's id). Chosen
  # from two measured rounds (docs/research/narrative-measure/2026-10-16*-result.md): the closest meaning that clears
  # 20 articles a day in both windows (2-15 Oct and 15-28 Jun 2026) with on-topic sampled titles. Edit = new id.
  # Narratives not listed here keep the title-or-path instrument (gdeltbqt) with their frozen DOC query.
  queries:
    # retired 20 Oct 2026 (Bernardo, first /narratives review): headline audit 20% on topic, tight definitions under the floor; history kept, discovery nominates bursts
    - {id: opec_supply_v3, retired: true, narrative: opec_supply_v2, name: "OPEC+ supply policy (v2: OPEC or oil output in the title)",
       query: '(opec OR "opec+" OR "opec plus" OR "oil output" OR "oil production" OR "crude output" OR "crude production" OR "output cut" OR "production cut" OR "output hike" OR "production quota" OR "output quota")'}
    # retired 20 Oct 2026: redesigned (Bernardo, 20 Oct evening) into 'Oil and product supply' (oil_supply) and 'Geopolitical risk' (geopolitics); history kept
    - {id: russia_oil_v2, retired: true, narrative: russia_oil_v1, name: "Russian oil sanctions (v2: Russia and oil in the title, sanctions in the text)",
       query: '(russia OR russian OR kremlin OR rosneft OR lukoil OR urals) (oil OR crude OR diesel OR fuel OR tanker OR tankers OR refinery OR refineries OR "shadow fleet") theme:SANCTIONS'}
    - {id: natgas_lng_v2, narrative: natgas_lng_v1, name: "Natural gas / LNG (v2: title phrases)",
       query: '("natural gas" OR lng OR "henry hub" OR "gas supply" OR "gas supplies" OR "gas shortage" OR "gas exports" OR "gas storage" OR "gas demand")'}
    # broadened: copper in the title (copper attention overall); the shortage angle alone stays under 20 a day
    # retired 20 Oct 2026 (Bernardo, first /narratives review): headline audit 16% on topic, tight definitions under the floor; history kept, discovery nominates bursts
    - {id: copper_shortage_v2, retired: true, narrative: copper_shortage_v1, name: "Copper shortage / AI power demand (v2: copper in the title)",
       query: 'copper'}
    # retired 20 Oct 2026 (Bernardo, first /narratives review): headline audit 44% on topic, tight definitions under the floor; history kept, discovery nominates bursts
    - {id: gold_buying_v2, retired: true, narrative: gold_buying_v1, name: "Gold buying / reserves (v2: gold in the title; central banks, reserves or buying)",
       query: '(gold OR bullion) (theme:WB_1235_CENTRAL_BANKS OR theme:ECON_CENTRALBANK OR theme:ECON_CURRENCY_RESERVES OR "central bank" OR "central banks" OR reserves OR buying OR demand OR etf OR etfs OR inflows OR "safe haven")'}
    # retired 20 Oct 2026 (Bernardo, first /narratives review): headline audit 44% on topic, tight definitions under the floor; history kept, discovery nominates bursts
    - {id: crop_weather_v2, retired: true, narrative: crop_weather_v1, name: "Crop weather / drought (v2: crops in the title; weather in the title or drought/heat/flood in the text)",
       query: '(corn OR soybean OR soybeans OR soy OR wheat OR maize OR grain OR grains OR crop OR crops OR harvest OR harvests OR yields) (theme:NATURAL_DISASTER_DROUGHT OR theme:NATURAL_DISASTER_DROUGHTS OR theme:NATURAL_DISASTER_HEAT_WAVE OR theme:NATURAL_DISASTER_HEATWAVE OR theme:NATURAL_DISASTER_HEAT_WAVES OR theme:NATURAL_DISASTER_HEATWAVES OR theme:NATURAL_DISASTER_FLOOD OR theme:NATURAL_DISASTER_FLOODING OR theme:NATURAL_DISASTER_FLOODS OR drought OR droughts OR dry OR dryness OR heat OR heatwave OR "heat wave" OR weather OR rain OR rains OR rainfall OR frost OR flood OR floods OR flooding)'}
    # retired 20 Oct 2026: removed from the map (Bernardo, 20 Oct evening); history kept
    - {id: trade_war_v2, retired: true, narrative: trade_war_v1, name: "Trade war / tariffs (v2: tariffs or trade war in the title)",
       query: '(tariff OR tariffs OR "trade war" OR "trade wars")'}
    - {id: fed_hike_v2, narrative: fed_hike_v1, name: "Fed hikes (v2: Fed and a hike word in the title)",
       query: '(fed OR "federal reserve" OR fomc OR powell) (hike OR hikes OR hiking OR "raise rates" OR "raises rates" OR "raising rates" OR tightening OR hawkish OR "rate increase" OR "rate increases")'}
    # retired 20 Oct 2026: removed from the map (Bernardo, 20 Oct evening); history kept
    - {id: inflation_scare_v2, retired: true, narrative: inflation_scare_v1, name: "Inflation scare (v2: inflation and a rising/fear word in the title)",
       query: 'inflation (fears OR fear OR worries OR worry OR concerns OR surge OR surges OR spike OR spikes OR sticky OR hot OR hotter OR accelerates OR accelerating OR jumps OR rises OR rising OR soars OR heats OR higher OR rebound OR rebounds)'}
    - {id: ai_bubble_v2, narrative: ai_bubble_v1, name: "AI bubble (v2: AI and bubble/selloff words in the title)",
       query: '(ai OR "artificial intelligence") (bubble OR bubbles OR selloff OR "sell off" OR overvalued OR overvaluation OR froth OR frothy OR mania OR hype)'}
    # 20 Oct 2026: the AI correction as the press words it: AI, chips or data centres with a selloff or worry word
    - {id: ai_trade_v1g, narrative: ai_trade_v1, retired: true, name: "AI trade scare (v2 words: AI/chips/data centres and a selloff or worry word in the title)",
       query: '(ai OR "artificial intelligence" OR chip OR chips OR chipmaker OR chipmakers OR semiconductor OR semiconductors OR nvidia OR "data center" OR "data centers" OR "data centre" OR "data centres" OR hyperscaler OR hyperscalers OR neocloud OR neoclouds) (selloff OR "sell off" OR selloffs OR rout OR routs OR slump OR slumps OR slide OR slides OR plunge OR plunges OR tumble OR tumbles OR sink OR sinks OR crash OR crashes OR correction OR meltdown OR jitters OR worries OR worry OR fears OR fear OR anxiety OR bubble OR bubbles OR overvalued OR "capex cuts" OR "spending cuts")'}
    # v2g (20 Oct, after the first live run): generic worry words (fears, worries, anxiety) and "slide" pulled in
    # off-topic AI stories (privacy, training data, presentation slides); market words only
    - {id: ai_trade_v2g, narrative: ai_trade_v1, name: "AI trade scare (v2g: AI/chips/data centres and a market selloff word in the title)",
       query: '(ai OR "artificial intelligence" OR chip OR chips OR chipmaker OR chipmakers OR semiconductor OR semiconductors OR nvidia OR "data center" OR "data centers" OR "data centre" OR "data centres" OR hyperscaler OR hyperscalers OR neocloud OR neoclouds) (selloff OR "sell off" OR selloffs OR rout OR routs OR slump OR slumps OR plunge OR plunges OR tumble OR tumbles OR sink OR sinks OR crash OR crashes OR correction OR meltdown OR jitters OR bubble OR bubbles OR overvalued OR "capex cuts" OR "spending cuts")'}
    # validation only: GDELT's EPU_* themes (inference: they look like the Baker-Bloom-Davis term sets)
    - {id: epu_replica_v2, narrative: epu_replica_v1, name: "EPU replica (v2: GKG EPU themes; validation)",
       query: 'theme:EPU_ECONOMY theme:EPU_UNCERTAINTY (theme:EPU_POLICY OR theme:EPU_POLICY_FEDERAL_RESERVE OR theme:EPU_POLICY_REGULATION)'}
