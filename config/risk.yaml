# Risk and crowding (agent 8). Descriptive: nothing here is a signal or a trade rule.
# Evidence behind each number: docs/research/risk.md. Bernardo's choices (10 Oct 2026): no budget caps (numbers
# only); amber early warning with red = the sizing assistant's drawdown cut counting open marks; replays + 6 named
# driver shocks + the worst case inside the k = 3 ellipsoid.

vol_lambda: 0.94          # EWMA decay for each market's current daily vol (RiskMetrics; vol only, never correlation)
corr_days: 250            # calm correlation window (Tang & Xiong; Tan & Zohren: 0.94 is too short for correlation)
min_days: 120             # a market needs this many common return days to enter the risk model

universe:                 # markets that define turbulence and the stress matrix (synchronous US closes)
  [BZ=F, CL=F, NG=F, HO=F, RB=F, GC=F, SI=F, HG=F, ZC=F, ZS=F, ZW=F, KC=F, SB=F,
   ES=F, NQ=F, ^RUT, ZN=F, ZT=F, DX-Y.NYB, EURUSD=X, JPY=X]

turbulence:               # Kritzman & Li (2010): Mahalanobis distance of each day's returns
  stress_pct: 80          # days at or above this percentile of turbulence build the stress matrix (top 20%)
  persist_days: 5         # early flag: turbulence at/above stress_pct on persist_min of the last persist_days
  persist_min: 3
  warning_window_days: 756  # the percentile and the warning read the last ~3 years; stress days use all history

clusters:
  link_corr: 0.7          # ideas whose directional stress correlation is >= this lose together (one cluster)
  same_corr: 0.95         # >= this they are the same idea (Carver: rules correlated > 0.95 are one rule)

history:                  # long history for stress (agent 8 v2, 10 Oct 2026: "the past shocks only look at a short history")
  # Futures returns from their first close (~2000 on Yahoo); before that, or on excluded days, the first proxy in the
  # list that has a close (returns are spliced, never levels; Fed GMS "mappings", EACH: "a relevant proxy"). Yields
  # map to note futures through a fixed duration. Markets with no series in an episode get their conditional mean
  # given the markets that have one (flagged "inferred"); none is ever silently zeroed.
  proxies:
    "BZ=F": [DCOILBRENTEU]
    "CL=F": [DCOILWTICO, "BZ=F", DCOILBRENTEU]
    "NG=F": [DHHNGSP]
    "HO=F": [DHOILNYH]
    "RB=F": [DGASNYH]
    "ES=F": ["^GSPC"]
    "NQ=F": ["^NDX"]
    "^RUT": []
    "^VIX": [VIXCLS]
    "ZN=F": [{yield: DGS10, duration: 6.5}]
    "ZT=F": [{yield: DGS2, duration: 1.9}]
  exclude:                # days a series is not used (then the next proxy is): WTI May-2020 expiry went to -$37.63
    "CL=F": [["2020-04-17", "2020-04-22"]]          # (CFTC: storage, open interest at expiry, thin book)
    DCOILWTICO: [["2020-04-17", "2020-04-22"]]
  calendar: ["ES=F", "^GSPC"]   # trading days = days either printed (US calendar); every series' move between two of
                                # its closes is booked on the first trading day on/after the later close
  gap_days: 10            # a series with no print in the last this-many days of an episode does not cover it (inferred)
  roll_screen:            # Yahoo continuous futures are not back-adjusted: a day whose own return differs from its proxy's
    diff: 0.04            # by more than 4% and more than 5 sd of that difference's past year is a suspected roll jump,
    sd: 5                 # and the proxy's return is used instead (flagged "screened"). Markets with no proxy keep
    proxy_share: 0.5      # only when the own move is big and the proxy moved less than half as much (a jump in the future,
                          # not the spot: Dated Brent's 2020 and 2026 breakaways are never substituted). Markets with no
                          # proxy keep their own returns (no free back-adjusted series); their roll days are a known limit

worst_case:               # Breuer et al. (2009): worst loss inside the plausibility ellipsoid
  k: 3.0
  horizons: [5, 20]       # one week; one month (Fed GMS liquidity horizon; FRTB 20 days for energy and metals)
  replay_k_markets: [BZ=F, ES=F, NQ=F, ZN=F, DX-Y.NYB]   # a replay's k is measured on these plus the book's markets

worst_windows:            # FRTB MAR33: the window in which today's book loses most, searched over all history
  horizons: [1, 5, 20, 60]  # 60 = FRTB liquidity horizon for ags and softs
  reverse_tail_pct: 1.0     # reverse stress: average market moves on the book's worst 1% of days ...
  reverse_scale: 0.85       # ... scaled for fat tails (Glasserman, Kang & Kang 2015: 0.80-0.86)

crisis_windows:           # named shocks are also propagated with these correlations (Axioma: show the window choice)
  gfc_2008: {name: "2008 (bonds rally as stocks fall)", start: "2008-09-01", end: "2009-03-31"}
  infl_2022: {name: "2022 (stocks and bonds fall together)", start: "2022-01-01", end: "2022-10-31"}

replays:                  # episode library: closes from start to end replayed day by day on today's book.
  # Source of each window: NBIM 2025 stress-test report (month-end windows), Eurex Prisma, Man Group, or "ours"
  # (event dates; no vendor window). Old episodes stay: CPMI-IOSCO, never dropped for age. Edit = new id.
  - {id: black_monday_1987, name: "Black Monday (Oct 1987)", start: "1987-10-14", end: "1987-10-19", src: ours}
  - {id: gulf_war_1990, name: "Iraq invades Kuwait (Aug-Oct 1990)", start: "1990-08-01", end: "1990-10-11", src: ours}
  - {id: desert_storm_1991, name: "Desert Storm oil collapse (Jan 1991)", start: "1991-01-16", end: "1991-01-17", src: ours}
  - {id: bond_massacre_1994, name: "Bond massacre (1994)", start: "1994-02-03", end: "1994-11-07", src: ours}
  - {id: asia_1997, name: "Asian crisis (H2 1997)", start: "1997-06-30", end: "1997-12-31", src: NBIM}
  - {id: ltcm_1998, name: "Russia default and LTCM (Aug-Sep 1998)", start: "1998-07-31", end: "1998-09-30", src: NBIM}
  - {id: dotcom_2000, name: "Dot-com bust (Sep 2000-Mar 2001)", start: "2000-08-31", end: "2001-03-31", src: NBIM}
  - {id: sep11_2001, name: "9/11 (Sep 2001)", start: "2001-08-31", end: "2001-09-30", src: NBIM}
  - {id: iraq_2003, name: "Iraq war premium unwinds (Mar 2003)", start: "2003-03-07", end: "2003-03-21", src: ours}
  - {id: commodity_boom_2008, name: "Commodity and inflation surge (Sep 2007-Jul 2008)", start: "2007-08-31", end: "2008-07-11", src: "Man (regime)"}
  - {id: gfc_2008, name: "Global financial crisis (May 2008-Feb 2009)", start: "2008-04-30", end: "2009-02-28", src: NBIM}
  - {id: lehman_2008, name: "Lehman (Sep 2008-Mar 2009)", start: "2008-09-01", end: "2009-03-02", src: Eurex}
  - {id: euro_downgrade_2011, name: "Euro crisis and US downgrade (Apr-Nov 2011)", start: "2011-03-31", end: "2011-11-30", src: NBIM}
  - {id: drought_2012, name: "US drought, grains spike (Jun-Aug 2012)", start: "2012-06-15", end: "2012-08-10", src: ours}
  - {id: gold_crash_2013, name: "Gold crash (Apr 2013)", start: "2013-04-11", end: "2013-04-15", src: ours}
  - {id: taper_2013, name: "Taper tantrum (May-Aug 2013)", start: "2013-04-30", end: "2013-08-31", src: NBIM}
  - {id: oil_collapse_2014, name: "Oil collapse (H2 2014)", start: "2014-06-30", end: "2014-12-31", src: NBIM}
  - {id: china_2015, name: "China devaluation (Jun-Sep 2015)", start: "2015-05-31", end: "2015-09-30", src: NBIM}
  - {id: oil_trough_2016, name: "Oil glut trough (Nov 2015-Jan 2016)", start: "2015-11-03", end: "2016-01-20", src: ours}
  - {id: volmageddon_2018, name: "Volatility blow-up (Feb 2018)", start: "2018-02-01", end: "2018-02-08", src: ours}
  - {id: q4_2018, name: "Q4 2018 sell-off", start: "2018-08-31", end: "2018-12-31", src: NBIM}
  - {id: abqaiq_2019, name: "Abqaiq attack (Sep 2019)", start: "2019-09-13", end: "2019-09-16", src: ours}
  - {id: covid_2020, name: "Covid crash (Feb-Mar 2020)", start: "2020-01-31", end: "2020-03-31", src: NBIM}
  - {id: opec_war_2020, name: "OPEC+ price war (Mar 2020)", start: "2020-03-06", end: "2020-03-09", src: ours}
  - {id: ukraine_2022, name: "Russia invades Ukraine (Feb-Jun 2022)", start: "2022-02-01", end: "2022-06-30", src: Eurex}
  - {id: rates_2022, name: "Inflation and rate shock (Jan-Sep 2022)", start: "2021-12-31", end: "2022-09-30", src: NBIM}
  - {id: svb_2023, name: "SVB and regional banks (Mar 2023)", start: "2023-03-08", end: "2023-03-17", src: ours}
  - {id: carry_2024, name: "Yen carry unwind (Aug 2024)", start: "2024-07-31", end: "2024-08-05", src: ours}
  - {id: tariff_2025, name: "Tariff shock (Feb-Apr 2025)", start: "2025-02-18", end: "2025-04-08", src: NBIM}
  - {id: war_2026, name: "Iran war week, Hormuz closed (Mar 2026)", start: "2026-02-27", end: "2026-03-09", src: ours}
  - {id: ceasefire_2026, name: "Ceasefire, oil collapse (Apr 2026)", start: "2026-04-07", end: "2026-04-10", src: ours}
  - {id: ai_slide_2026, name: "AI-stock slide (Jul 2026)", start: "2026-07-16", end: "2026-07-29", src: ours}

scenarios:                # named driver shocks over one month (Fed GMS and BlackRock: 1-month horizon). Every other
                          # market moves by its conditional mean given the drivers (Kupiec; Rebonato), under the stress
                          # matrix and under each crisis window; "isolated" moves the drivers only (Bloomberg PORT).
                          # analogue = the closest real episode, shown beside it (Bloomberg back-tests its shocks).
                          # Edit = new id, so a scenario never changes meaning.
  - {id: oil_supply_spike_v1, name: "Oil supply spike", drivers: {"BZ=F": 0.25, "ES=F": -0.03}, analogue: [gulf_war_1990, war_2026],
     chain: "Hormuz shut again: Brent +25%, equities -3% (supply shock: oil up, stocks down; Kilian & Park)"}
  - {id: demand_collapse_v1, name: "Demand collapse", drivers: {"BZ=F": -0.20, "ES=F": -0.08, "ZN=F": 0.02}, analogue: [gfc_2008, covid_2020],
     chain: "Recession scare: Brent -20%, S&P -8%, 10y note +2% (demand shock: oil and stocks down together; Fed 2025 GMS)"}
  - {id: fed_hike_v1, name: "Fed hike shock", drivers: {"ZN=F": -0.025, "DX-Y.NYB": 0.02}, analogue: [bond_massacre_1994, rates_2022],
     chain: "Hawkish surprise: 10y note -2.5% (about +35bp), dollar index +2%"}
  - {id: ai_unwind_v1, name: "AI equity unwind", drivers: {"NQ=F": -0.15, "ES=F": -0.10}, analogue: [dotcom_2000, ai_slide_2026],
     chain: "AI capex doubts: Nasdaq 100 -15%, S&P -10% (Atlas: July 2026 slide; NBIM AI correction)"}
  - {id: usd_squeeze_v1, name: "USD squeeze", drivers: {"DX-Y.NYB": 0.04}, analogue: [lehman_2008],
     chain: "Dollar funding squeeze: dollar index +4%"}
  - {id: risk_off_funding_v1, name: "Risk-off funding shock", drivers: {"^VIX": 0.60, "ES=F": -0.06}, analogue: [covid_2020, carry_2024],
     chain: "VIX +60%, S&P -6%; commodity longs cut as funding tightens (Cheng, Kirilenko & Xiong)"}
  - {id: hedges_fail_v1, name: "Hedges fail (decorrelation)", drivers: {"ES=F": -0.10, "ZN=F": -0.03, "GC=F": -0.06}, analogue: [rates_2022],
     chain: "Stocks, bonds and gold fall together (LCH and ICE decorrelation scenarios; 2022)"}
  - {id: crop_failure_v1, name: "Crop failure", drivers: {"ZC=F": 0.30, "ZS=F": 0.20, "ZW=F": 0.25}, analogue: [drought_2012],
     chain: "Two failed harvests: corn +30%, soybeans +20%, wheat +25% (NBIM extreme-weather scenario)"}
  - {id: inflation_reaccel_v1, name: "Inflation re-acceleration", drivers: {"BZ=F": 0.15, "GC=F": 0.10, "ZN=F": -0.04}, analogue: [commodity_boom_2008, rates_2022],
     chain: "Inflation back above 5%: Brent +15%, gold +10%, 10y note -4% (Man Group inflation regimes)"}

sign_flip_r: 0.25          # a named shock flags a sign flip when one matrix gives <= -this and another >= +this
scenario_horizon_days: 20   # named shocks are one-month moves; their k is scaled to this

drawdown:                 # Bernardo's rule (10 Oct 2026). Red is the sizing assistant's cut (config/journal.yaml
  amber_r: 3.0            # sizing.drawdown), now counting open marks. Amber: book down this many R ...
  amber_days: 10          # ... from its high over the last this-many trading days
  cluster_ideas: 3        # or this many ideas in one cluster ...
  cluster_r: -0.5         # ... each at or below this R
  curve_days: 60          # trading days of book history kept for the curve

crowding:
  crowded_pct: 90         # CFTC 3-year percentile on the idea's side (agent 7's threshold)
  change_z: 2.0           # weekly managed-money change on the idea's side, in sd of 3 years of weekly changes
  weeks: 156
  release_lag_days: 3      # CFTC data are as of Tuesday and published Friday: a report counts from its release
  resid_lags: [4, 13, 52] # weeks of price return that the residual percentile removes (Sanders et al.; MOP)

funding:                  # crowding turns red only when funding is stressing (Cheng et al.; Brunnermeier & Pedersen)
  hy_series: BAMLH0A0HYM2
  hy_days: 21             # observations
  hy_change_bp: 50
  vix_series: "^VIX"
  vix_pct: 80

cta:
  roll_days: 5            # legs that flip by roll-off within this many days at today's price
  fast_halflife: 20       # vol-target channel: implied scale = slow vol / fast vol (Harvey et al. 2018)
  slow_halflife: 60
  shrink_below: 0.7       # below this, vol-targeted trend books are shrinking with no flip
  panic_ret_days: 504     # Daniel & Moskowitz panic state: 24-month return < 0 ...
  panic_vol_days: 126     # ... and 126-day vol at or above this percentile of its own history
  panic_vol_pct: 80
  panic_lookback_days: 756 # vol percentile over the last ~3 years (as before the long history)
  stop_near_flip_sd: 0.5  # a stop within this many daily sd of a flip level sits at a crowded level (Taleb)

captions:
  model: "Risk model: daily log returns of front-month closes (Yahoo continuous contracts, roll gaps not adjusted) spliced with spot/index proxies where a contract has no close (flagged). Current vol = EWMA 0.94; calm correlation = last 250 days; stress correlation = the top-20% turbulence days of the whole history; both shrunk toward constant correlation (Ledoit & Wolf)."
  stress: "Stress P&L in R from today's marks. Replays run day by day: 'stops honoured' exits at the first close beyond the stop (a gap can cost more than 1R); 'gapped' holds to the end. Instantaneous shocks cap honoured losses at the stop. k = plausibility: the scenario's Mahalanobis distance under the stress matrix (scaled to its length), converted to a one-market sd equivalent, so 3 is about as rare as a 3-sd move in one market. Stress tests are not early warnings (Borio et al.)."
  cta: "Prices at which a simple 1/3/12-month trend model would flip sign: describes likely systematic positioning, not a forecast. Published evidence finds trend-flow price pressure small (about 0.2% a week) and fading or reversing within about 4 weeks (Kang, Rouwenhorst & Tang)."
  crowding: "CFTC levels mostly restate past returns (returns lead positions in 10 of 10 markets: Sanders, Irwin & Merrin). Crowding is context; it turns red only when funding is stressing. No crowding or CTA flag alerts unless the research loop (agent 12) rates it supported; its measured verdicts are listed under the CTA table."
  rule: "Descriptive only: no component is a signal until it passes the quant-research gate. Suggestions and decisions stay with the PM."
