- id: wasde-ending-stocks-revision
  claim: A US ending-stocks revision up (vs the previous WASDE) goes with a lower price on the day.
  driver: Revision of US ending stocks vs the previous report, in sd
  target: Same-day return
  sign: '-'
  lag: report day
  status: untested
  source: own estimate (pmstack ags), WASDE as first published (agent 9)
  notes: 'Only 8 revisions of at least 1 sd: too few for a sign-agreement rate. No consensus is stored: part of
    the revision was expected, so the slope is attenuated.'
  sizes:
  - kind: own_estimate
    value: -1.1193
    ci:
    - -1.5874
    - -0.6513
    unit: '% per 1 sd revision (90% CI; t -3.93)'
    n: 54
    as_of: '2026-10-29'
    regression: knowledge/ags/corn/estimates/wasde-days.json#revision
- id: condition-corn
  claim: A bigger-than-seasonal improvement in corn condition goes with a lower price the next day.
  driver: Weekly good + excellent change vs its seasonal norm, in sd
  target: ZC=F next-day return
  sign: '-'
  lag: next trading day
  status: untested
  source: own estimate (pmstack ags); Lehecka (2014) finds reactions, strongest July-August
  notes: 'From 2020 (five prior seasons for the norm, changes across seasons left out): t -2.1742; sign hit 0.609
    of 46.'
  sizes:
  - kind: own_estimate
    value: -0.2633
    ci:
    - -0.463
    - -0.064
    unit: '% per 1 sd condition surprise (90% CI)'
    n: 132
    as_of: '2026-10-29'
    regression: knowledge/ags/corn/estimates/crop_progress-corn.json
- id: july-heat
  claim: Heat above about 29 °C during pollination cuts corn yields steeply.
  driver: Degree days above 29 °C (July)
  target: US corn yield
  sign: '-'
  lag: same season
  status: literature only
  source: Schlenker & Roberts (2009)
  sizes:
  - kind: literature
    value: 29
    unit: °C threshold above which corn yields fall steeply (soybeans 30 °C)
    source: Schlenker & Roberts (2009), PNAS
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2747166
    where: abstract
  notes: No daily temperature data are stored (open question).
