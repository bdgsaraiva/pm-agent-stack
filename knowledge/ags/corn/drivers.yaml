# Written by pmstack/knowledge.py only (add, confirm-prior, estimate). Rendered to drivers.md.
# sizes[].kind: literature | own_estimate | bernardo_prior (specialists-kickoff.md section 4)
- id: stocks-to-use
  claim: Low stocks-to-use makes price more sensitive to small supply and demand shocks (spikes happen near minimal
    stocks).
  driver: Stocks-to-use (WASDE, agent 9) and its percentile
  target: Price level and volatility
  sign: '-'
  lag: same season
  status: literature only
  source: Wright (2011/2012); Adjemian (2012) (larger WASDE effects at low carryover)
  notes: 'Read as sensitivity, not direction. No size: the relation is non-linear and the literature gives no portable
    slope.'
  sizes: []
- id: enso
  claim: 'ENSO shifts global yields: El Niño has raised soybean yields and changed other crops slightly; La Niña
    lowers yields of all four major crops.'
  driver: Oceanic Niño Index (NOAA)
  target: Global yields; prices at intermediate horizons
  sign: '?'
  lag: months to a season
  status: literature only
  source: Iizumi et al. (2014); Ubilava (2018)
  sizes:
  - kind: literature
    range:
    - -4.3
    - 0.8
    unit: '% change in global-mean maize, rice and wheat yields in El Niño years (soybeans: likely higher)'
    source: Iizumi et al. (2014), Nature Communications 5:3712
    url: https://eprints.whiterose.ac.uk/id/eprint/80272/
    where: abstract
  - kind: literature
    range:
    - -4.5
    - 0.0
    unit: '% change in global-mean yields of maize, rice, wheat and soybeans in La Niña years'
    source: Iizumi et al. (2014), Nature Communications 5:3712
    url: https://eprints.whiterose.ac.uk/id/eprint/80272/
    where: abstract
  - kind: literature
    value: 30
    unit: '% of price variation at intermediate horizons attributed to ENSO shocks (up to; working-paper listing)'
    source: Ubilava (2018), AJAE 100(1)
    url: https://ideas.repec.org/a/oup/ajagec/v100y2018i1p239-263..html
    where: WP listing
  notes: 'Context, never a forecast: effects differ by region and crop calendar.'
- id: wasde-day-volatility
  claim: WASDE (months without Grain Stocks) days are more volatile than the days around them.
  driver: WASDE (months without Grain Stocks) release day
  target: CBOT corn daily return volatility
  sign: +
  lag: release day
  status: untested
  source: own estimate (pmstack ags); Adjemian (2012) for WASDE
  notes: Vs all other days 1.271; placebo local ratios -5d 0.937, +10d 0.802. Day categories are disjoint (no day
    counted twice). Contemporaneous, predicts nothing.
  sizes:
  - kind: own_estimate
    value: 1.314
    unit: mean abs(return)/sd on report days over the 10 days either side (paired t 5.2)
    n: 295
    as_of: '2026-10-29'
    regression: knowledge/ags/corn/estimates/wasde-days.json#local
