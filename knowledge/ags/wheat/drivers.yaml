- id: wasde-ending-stocks-revision
  claim: A US ending-stocks revision up (vs the previous WASDE) goes with a lower price on the day.
  driver: Revision of US ending stocks vs the previous report, in sd
  target: Same-day return
  sign: '-'
  lag: report day
  status: untested
  source: own estimate (pmstack ags), WASDE as first published (agent 9)
  notes: 'Only 7 revisions of at least 1 sd: too few for a sign-agreement rate. No consensus is stored: part of
    the revision was expected, so the slope is attenuated.'
  sizes:
  - kind: own_estimate
    value: -0.2193
    ci:
    - -0.7963
    - 0.3577
    unit: '% per 1 sd revision (90% CI; t -0.63)'
    n: 54
    as_of: '2026-10-29'
    regression: knowledge/ags/wheat/estimates/wasde-days.json#revision
- id: condition-winter-wheat
  claim: A bigger-than-seasonal improvement in winter wheat condition goes with a lower price the next day.
  driver: Weekly good + excellent change vs its seasonal norm, in sd
  target: ZW=F next-day return
  sign: '-'
  lag: next trading day
  status: untested
  source: own estimate (pmstack ags); Lehecka (2014) finds reactions, strongest July-August
  notes: 'From 2019 (five prior seasons for the norm, changes across seasons left out): t -1.5064 (not significant
    on its own); sign hit 0.511 of 45.'
