    value: -0.2191
    ci:
    - -0.458
    - 0.02
    unit: '% per 1 sd condition surprise (90% CI)'
    n: 119
    as_of: '2026-10-29'
    regression: knowledge/ags/wheat/estimates/crop_progress-winter_wheat.json
