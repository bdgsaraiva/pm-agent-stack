- id: power-cost
  claim: Higher power costs (coal in China, gas-linked power in Europe) raise the aluminium cost curve and curtail
    smelters.
  driver: Smelter power cost
  target: Aluminium price, smelter output
  sign: +
  lag: months
  status: literature only
  source: S&P Global Commodity Insights news (power usually over a third of cost); no study found tying curtailments
    to power prices
  notes: 'No size: no quantified public study found (25 Oct). Candidate for Bernardo''s priors.'
  sizes: []
- id: china-capacity-cap
  claim: China's ~45 Mt smelting capacity cap (since 2017) limits Chinese supply growth to debottlenecking.
  driver: Chinese capacity policy
  target: World primary supply growth
  sign: '-'
  lag: years
  status: literature only
  source: Reuters via Engineering News (Sep 2026); SMM
  notes: Sources disagree on 45 vs 45.5 Mt; output ran above the cap in 2026 through debottlenecking.
  sizes: []
