- id: demand-shocks-dominate
  claim: Long-run metal price swings are driven mostly by demand shocks (industrialisation, urbanisation); supply
    shocks are smaller and shorter.
  driver: World (China-led) industrial demand
  target: Real metal price
  sign: +
  lag: years
  status: literature only
  source: Stuermer (2018); Jacks & Stuermer (2020); Erten & Ocampo (2013)
  notes: Copper and tin are exceptions where supply shocks matter more (oligopolistic structure). Context for the
    long-run block, never a timing signal.
  sizes:
  - kind: literature
    value: 15
    range:
    - 5
    - 15
    unit: 'years an effect lasts: demand shocks up to ~15, supply shocks ~5'
    source: Stuermer (2014 WP; Macroeconomic Dynamics 2018), 150 years of boom and bust
    url: https://www.dallasfed.org/-/media/documents/research/papers/2014/wp1414.pdf
    where: abstract
- id: steel-markup
  claim: Chinese steel prices behave as a mark-up over iron ore and coking coal, so ore follows Chinese steel margins
    and output.
  driver: Chinese steel price and output
  target: Iron ore price
  sign: +
  lag: weeks
  status: literature only
  source: RBA Bulletin (Sep 2013), structural VECM on weekly prices 2010-2013
  notes: Short sample from one regime; no size taken.
  sizes: []
